<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#06152b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="20%" stop-color="#38BDF8" stop-opacity=".95"/>
      <stop offset="75%" stop-color="#0EA5E9" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38BDF8" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>

  <g font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700">
    <!-- column 1 -->
    <g transform="translate(55,-330)" fill="url(#fade)" filter="url(#glow)">
      <text y="0">1</text><text y="24">0</text><text y="48">1</text><text y="72">0</text><text y="96">1</text><text y="120">1</text><text y="144">0</text><text y="168">1</text><text y="192">0</text><text y="216">1</text><text y="240">0</text><text y="264">1</text><text y="288">1</text><text y="312">0</text>
      <animateTransform attributeName="transform" type="translate" from="55 -330" to="55 430" dur="7s" repeatCount="indefinite"/>
    </g>

    <!-- column 2 -->
    <g transform="translate(125,-210)" fill="url(#fade)" opacity=".75">
      <text y="0">0</text><text y="24">1</text><text y="48">0</text><text y="72">0</text><text y="96">1</text><text y="120">1</text><text y="144">0</text><text y="168">1</text><text y="192">0</text><text y="216">1</text>
      <animateTransform attributeName="transform" type="translate" from="125 -210" to="125 420" dur="9s" repeatCount="indefinite"/>
    </g>

    <!-- column 3 -->
    <g transform="translate(205,-360)" fill="url(#fade)">
      <text y="0">1</text><text y="24">1</text><text y="48">0</text><text y="72">1</text><text y="96">0</text><text y="120">0</text><text y="144">1</text><text y="168">1</text><text y="192">0</text><text y="216">1</text><text y="240">0</text><text y="264">1</text>
      <animateTransform attributeName="transform" type="translate" from="205 -360" to="205 430" dur="6.5s" repeatCount="indefinite"/>
    </g>

    <!-- column 4 -->
    <g transform="translate(290,-190)" fill="url(#fade)" opacity=".7">
      <text y="0">0</text><text y="24">1</text><text y="48">1</text><text y="72">0</text><text y="96">1</text><text y="120">0</text><text y="144">1</text><text y="168">0</text><text y="192">1</text>
      <animateTransform attributeName="transform" type="translate" from="290 -190" to="290 410" dur="8s" repeatCount="indefinite"/>
    </g>

    <!-- column 5 -->
    <g transform="translate(380,-300)" fill="url(#fade)" filter="url(#glow)">
      <text y="0">1</text><text y="24">0</text><text y="48">1</text><text y="72">1</text><text y="96">0</text><text y="120">1</text><text y="144">0</text><text y="168">1</text><text y="192">1</text><text y="216">0</text><text y="240">1</text>
      <animateTransform attributeName="transform" type="translate" from="380 -300" to="380 430" dur="7.8s" repeatCount="indefinite"/>
    </g>

    <!-- column 6 -->
    <g transform="translate(465,-235)" fill="url(#fade)" opacity=".65">
      <text y="0">0</text><text y="24">0</text><text y="48">1</text><text y="72">0</text><text y="96">1</text><text y="120">1</text><text y="144">0</text><text y="168">1</text><text y="192">0</text><text y="216">1</text>
      <animateTransform attributeName="transform" type="translate" from="465 -235" to="465 420" dur="10s" repeatCount="indefinite"/>
    </g>

    <!-- column 7 -->
    <g transform="translate(555,-350)" fill="url(#fade)">
      <text y="0">1</text><text y="24">0</text><text y="48">0</text><text y="72">1</text><text y="96">1</text><text y="120">0</text><text y="144">1</text><text y="168">0</text><text y="192">1</text><text y="216">1</text><text y="240">0</text><text y="264">1</text>
      <animateTransform attributeName="transform" type="translate" from="555 -350" to="555 430" dur="6.8s" repeatCount="indefinite"/>
    </g>

    <!-- column 8 -->
    <g transform="translate(650,-160)" fill="url(#fade)" opacity=".72">
      <text y="0">0</text><text y="24">1</text><text y="48">1</text><text y="72">0</text><text y="96">1</text><text y="120">0</text><text y="144">0</text><text y="168">1</text>
      <animateTransform attributeName="transform" type="translate" from="650 -160" to="650 400" dur="8.8s" repeatCount="indefinite"/>
    </g>

    <!-- column 9 -->
    <g transform="translate(745,-320)" fill="url(#fade)" filter="url(#glow)">
      <text y="0">1</text><text y="24">1</text><text y="48">0</text><text y="72">1</text><text y="96">0</text><text y="120">1</text><text y="144">1</text><text y="168">0</text><text y="192">0</text><text y="216">1</text><text y="240">0</text>
      <animateTransform attributeName="transform" type="translate" from="745 -320" to="745 430" dur="7.2s" repeatCount="indefinite"/>
    </g>

    <!-- column 10 -->
    <g transform="translate(835,-225)" fill="url(#fade)" opacity=".68">
      <text y="0">0</text><text y="24">1</text><text y="48">0</text><text y="72">1</text><text y="96">1</text><text y="120">0</text><text y="144">1</text><text y="168">0</text><text y="192">1</text><text y="216">0</text>
      <animateTransform attributeName="transform" type="translate" from="835 -225" to="835 420" dur="9.4s" repeatCount="indefinite"/>
    </g>

    <!-- column 11 -->
    <g transform="translate(930,-360)" fill="url(#fade)">
      <text y="0">1</text><text y="24">0</text><text y="48">1</text><text y="72">0</text><text y="96">1</text><text y="120">1</text><text y="144">0</text><text y="168">1</text><text y="192">0</text><text y="216">1</text><text y="240">1</text><text y="264">0</text>
      <animateTransform attributeName="transform" type="translate" from="930 -360" to="930 430" dur="6.3s" repeatCount="indefinite"/>
    </g>

    <!-- column 12 -->
    <g transform="translate(1025,-195)" fill="url(#fade)" opacity=".73">
      <text y="0">0</text><text y="24">0</text><text y="48">1</text><text y="72">1</text><text y="96">0</text><text y="120">1</text><text y="144">0</text><text y="168">1</text><text y="192">0</text>
      <animateTransform attributeName="transform" type="translate" from="1025 -195" to="1025 410" dur="8.5s" repeatCount="indefinite"/>
    </g>

    <!-- column 13 -->
    <g transform="translate(1120,-305)" fill="url(#fade)" filter="url(#glow)">
      <text y="0">1</text><text y="24">0</text><text y="48">1</text><text y="72">1</text><text y="96">0</text><text y="120">0</text><text y="144">1</text><text y="168">1</text><text y="192">0</text><text y="216">1</text><text y="240">0</text>
      <animateTransform attributeName="transform" type="translate" from="1120 -305" to="1120 430" dur="7.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- circuitry -->
  <g stroke="#38BDF8" stroke-opacity=".22" fill="none">
    <path d="M0 305H170L210 265H350"/>
    <path d="M850 320H1015L1065 270H1200"/>
    <path d="M40 335H280L315 300H460"/>
    <path d="M760 340H980L1010 310H1160"/>
  </g>

  <g fill="#38BDF8" opacity=".45">
    <circle cx="210" cy="265" r="3"/>
    <circle cx="1065" cy="270" r="3"/>
    <circle cx="315" cy="300" r="3"/>
    <circle cx="1010" cy="310" r="3"/>
  </g>

  <!-- border -->
  <rect x="1.5" y="1.5" width="1197" height="357" rx="26.5"
        fill="none" stroke="#38BDF8" stroke-opacity=".28" stroke-width="3"/>
</svg>