<svg width="1200" height="430" viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#07152f"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>

    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#2563EB" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="45" height="45"
             patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1"
              fill="#38BDF8"
              opacity=".10"/>
    </pattern>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="430" rx="32" fill="url(#bg)"/>

  <circle cx="980" cy="90" r="330" fill="url(#glow)"/>
  <circle cx="210" cy="390" r="260" fill="url(#glow)"/>

  <rect width="1200" height="430"
        rx="32"
        fill="url(#grid)"/>

  <!-- STARS -->
  <g fill="#7DD3FC" opacity=".65">
    <circle cx="870" cy="65" r="2"/>
    <circle cx="1010" cy="115" r="1.5"/>
    <circle cx="1090" cy="60" r="1"/>
    <circle cx="940" cy="165" r="1"/>
    <circle cx="1130" cy="205" r="2"/>
    <circle cx="780" cy="120" r="1.2"/>
    <circle cx="690" cy="75" r="1"/>
    <circle cx="520" cy="55" r="1"/>
    <circle cx="350" cy="80" r="1.5"/>
  </g>

  <!-- NAME -->
  <text x="90" y="145"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="900"
        font-size="72"
        fill="url(#name)">
    IEGO NERI
  </text>

  <rect x="92" y="170"
        width="80"
        height="5"
        rx="3"
        fill="url(#line)"/>

  <!-- SUBTITLE -->
  <text x="92" y="220"
        font-family="Arial, Helvetica, sans-serif"
        font-size="22"
        letter-spacing="7"
        fill="#E0F2FE">
    CODE • TECH • CREATE
  </text>

  <text x="92" y="260"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18"
        fill="#94A3B8">
    Guaraciaba do Norte, Ceará, Brasil • Informática • Tecnologia • Criação
  </text>

  <!-- NEON WAVES -->
  <path d="M0 340
           C180 280 310 390 480 330
           C650 270 780 370 960 310
           C1070 275 1140 280 1200 300"
        stroke="#38BDF8"
        stroke-width="3"
        fill="none"
        opacity=".85"/>

  <path d="M0 365
           C170 320 300 390 470 350
           C650 310 790 385 960 335
           C1080 300 1140 310 1200 320"
        stroke="#818CF8"
        stroke-width="3"
        fill="none"
        opacity=".75"/>

  <path d="M0 385
           C200 335 330 420 520 365
           C710 310 820 400 1000 345
           C1090 320 1150 330 1200 340"
        stroke="#A855F7"
        stroke-width="2"
        fill="none"
        opacity=".45"/>

  <!-- BORDER -->
  <rect x="2" y="2"
        width="1196"
        height="426"
        rx="30"
        fill="none"
        stroke="url(#line)"
        stroke-width="2"
        opacity=".40"/>

</svg>
